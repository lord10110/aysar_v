name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Point Aysar at Chrome
        shell: bash
        run: echo "AYSAR_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/aysar doctor
          mkdir -p smoke/site && echo '<html><head><title>T</title></head><body><main><h1>Hi</h1></main></body></html>' > smoke/site/index.html
          ./target/release/aysar rebuild ./smoke/site "Recreate this" --agent dry-run --projects-dir smoke/projects --kind website
          ./target/release/aysar status smoke/projects/site
      - uses: actions/upload-artifact@v4
        with:
          name: aysar-${{ matrix.os }}
          path: |
            target/release/aysar
            target/release/aysar.exe
          if-no-files-found: ignore
