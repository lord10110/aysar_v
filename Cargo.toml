[workspace]
resolver = "2"
members = [
    "crates/aysar-core",
    "crates/aysar-capture",
    "crates/aysar-analysis",
    "crates/aysar-spec",
    "crates/aysar-build",
    "crates/aysar-verify",
    "crates/aysar-render",
    "crates/aysar-enrich",
    "crates/aysar-ui",
    "crates/aysar-orchestrator",
    "crates/aysar-mcp",
    "apps/aysar-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lord10110/aysar_v"
authors = ["Aysar contributors"]
rust-version = "1.80"
keywords = ["reverse-engineering", "coding-agent", "mcp", "website", "rebuild"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[workspace.dependencies]
aysar-core = { path = "crates/aysar-core" }
aysar-capture = { path = "crates/aysar-capture" }
aysar-analysis = { path = "crates/aysar-analysis" }
aysar-spec = { path = "crates/aysar-spec" }
aysar-build = { path = "crates/aysar-build" }
aysar-verify = { path = "crates/aysar-verify" }
aysar-render = { path = "crates/aysar-render" }
aysar-enrich = { path = "crates/aysar-enrich" }
aysar-ui = { path = "crates/aysar-ui" }
aysar-orchestrator = { path = "crates/aysar-orchestrator" }
aysar-mcp = { path = "crates/aysar-mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ureq = "2"
scraper = "0.20"
url = "2"
sha2 = "0.11"
hex = "0.4"
headless_chrome = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
tiny_http = "0.12"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
